services:
  shoppinglist:
    build:
      context: .
      dockerfile: Dockerfile
    image: shoppinglist:latest
    container_name: shoppinglist
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=1000
      # Optional admin view (/config-lists). Set ADMIN_TOKEN in a local .env file
      # (not in git), or use ADMIN_TOKEN_FILE with a Docker secret.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      - shopping_list_data:/usr/src/app/data
    pull_policy: build

volumes:
  shopping_list_data:
